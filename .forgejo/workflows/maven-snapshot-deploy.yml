# Publishes a Maven library snapshot to Forgejo's own package registry on every push. Adapted
# from SYS/devenv's samples/maven-snapshot-deploy.yml for this repo: no <distributionManagement>
# in pom.xml (existing house convention), so this deploys via Maven's -DaltDeploymentRepository
# flag instead - no pom.xml edit needed for that part.
#
# EXTRA_MAVEN_OWNERS (new, 2026-08-01): this project depends on cz.bliksoft.java:common-java-utils
# from Java-BSToolbox, published under this same org. Rather than adding <repositories> to
# pom.xml (which would affect every environment that builds this code, including local dev
# machines that already configure these repos in their own ~/.m2/settings.xml), the extra read
# repositories are generated into this CI-only settings.xml instead, driven by a plain list of
# owner names below - add more owners here (space-separated) if this project ever needs to read
# from additional orgs/users, no other change needed. Each extra owner reuses this same
# ORG_PACKAGES_TOKEN for reads - Forgejo requires auth to read Maven packages even under a public
# org (confirmed 2026-08-01 - unlike the container/OCI registry, which is anonymously public for
# public orgs). If a future owner needs a different read credential than this job's own
# ORG_PACKAGES_TOKEN, this loop will need a matching per-owner token secret added too.
#
# This file lives on GitHub (the real source of truth, which Forgejo pull-mirrors) rather than
# being pushed directly to the Forgejo side - a commit made only on the Forgejo side of a pull
# mirror would very likely be silently discarded on the next sync from GitHub.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  snapshot-deploy:
    runs-on: maven-jdk
    env:
      MAVEN_OPTS: "-Dmaven.repo.local=/tmp/m2-repo"
      EXTRA_MAVEN_OWNERS: "Bliksoft-public"
    steps:
      - name: Clone repository
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${{ vars.REGISTRY_URL }}/${{ github.repository }}.git" src

      - name: Write Maven settings.xml
        run: |
          cat > settings.xml <<'PART1'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>forgejo-deploy</id>
                <username>bot</username>
                <password>${env.MVN_TOKEN}</password>
              </server>
          PART1

          for OWNER in $EXTRA_MAVEN_OWNERS; do
            echo "      <server><id>forgejo-$OWNER</id><username>bot</username><password>\${env.MVN_TOKEN}</password></server>" >> settings.xml
          done

          cat >> settings.xml <<'PART2'
            </servers>
            <profiles>
              <profile>
                <id>extra-repos</id>
                <activation><activeByDefault>true</activeByDefault></activation>
                <repositories>
          PART2

          for OWNER in $EXTRA_MAVEN_OWNERS; do
            echo "          <repository><id>forgejo-$OWNER</id><url>https://${{ vars.REGISTRY_URL }}/api/packages/$OWNER/maven</url></repository>" >> settings.xml
          done

          cat >> settings.xml <<'PART3'
                </repositories>
              </profile>
            </profiles>
            <activeProfiles><activeProfile>extra-repos</activeProfile></activeProfiles>
          </settings>
          PART3

      # -U forces Maven to re-check the registry for newer SNAPSHOT dependencies every run,
      # rather than trusting its default once-per-day update policy - necessary now that the
      # local repo cache persists across separate job runs (see K8s_Talos/talos-minipc/
      # k8s_forgejo/04-runner-config-configmap.yaml's maven-cache volume), otherwise a consumer
      # of an internal SNAPSHOT dependency can keep resolving a stale locally-cached copy
      # indefinitely instead of picking up a newer publish (observed 2026-08-01: this project's
      # own build resolved common-java-utils:0.7-SNAPSHOT straight from the shared cache without
      # ever checking the registry, since Java-BSToolbox's own build had already installed it
      # there). Applied unconditionally, not just when a snapshot dependency is known today - a
      # harmless no-op otherwise, and this project may gain snapshot dependencies later.
      - name: Build and test
        working-directory: src
        run: mvn -B -U verify -s ../settings.xml
        env:
          MVN_TOKEN: ${{ secrets.ORG_PACKAGES_TOKEN }}

      - name: Determine current version/coordinates
        working-directory: src
        run: |
          echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)" >> "$GITHUB_ENV"
          echo "ARTIFACT_ID=$(mvn -B -q help:evaluate -Dexpression=project.artifactId -DforceStdout)" >> "$GITHUB_ENV"

      - name: Deploy
        working-directory: src
        run: |
          mvn -B -U -s ../settings.xml deploy -DskipTests \
            -DaltDeploymentRepository=forgejo-deploy::default::https://${{ vars.REGISTRY_URL }}/api/packages/${{ github.repository_owner }}/maven
        env:
          MVN_TOKEN: ${{ secrets.ORG_PACKAGES_TOKEN }}

      - name: Link package to this repo (best-effort, cosmetic only)
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          PKG_NAME=$(curl -sf -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" \
            "https://${{ vars.REGISTRY_URL }}/api/v1/packages/$OWNER?type=maven" \
            | jq -r --arg a "$ARTIFACT_ID" '.[] | select(.name | contains($a)) | .name' | head -1)
          curl -s -w 'link status=%{http_code}\n' -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" -X POST \
            "https://${{ vars.REGISTRY_URL }}/api/v1/packages/$OWNER/maven/$PKG_NAME/-/link/$REPO_NAME"
